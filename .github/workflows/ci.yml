name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'fixtures/**'
              - 'crates/sim-types/**'
              - 'crates/sim-asset/**'
              - 'crates/sim-core/**'
              - 'crates/sim-render/**'
              - 'crates/sim-worker/**'
              - 'crates/asset-compiler/**'
              - 'crates/relay-server/src/protocol.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent config sync
        run: python3 scripts/check-agent-sync.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p sim-types -p sim-asset -p sim-core -p sim-render -p sim-worker --target wasm32-unknown-unknown

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: web (shard ${{ matrix.shard }}/3)
    env:
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Node tests
        if: matrix.shard == 1
        working-directory: web
        run: npm test
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: npm run test:viewer -- --project=default --shard=${{ matrix.shard }}/3

  web-editor:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: web-editor smoke
    env:
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: >-
          npm run test:viewer -- --project=track-editor
          --grep "renders the procedural example track|kerb spans can be trimmed and rebuilt|editing a kerb segment preserves the camera view"

  gate:
    name: gate
    if: always()
    needs: [changes, policy, rust, web, web-editor]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped jobs
        run: |
          echo "changes=${{ needs.changes.result }} policy=${{ needs.policy.result }} rust=${{ needs.rust.result }} web=${{ needs.web.result }} web-editor=${{ needs['web-editor'].result }}"
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.policy.result }}" = "success"
          case "${{ needs.rust.result }}" in
            success|skipped) ;;
            *) echo "rust=${{ needs.rust.result }}"; exit 1 ;;
          esac
          case "${{ needs.web.result }}" in
            success|skipped) ;;
            *) echo "web=${{ needs.web.result }}"; exit 1 ;;
          esac
          case "${{ needs['web-editor'].result }}" in
            success|skipped) ;;
            *) echo "web-editor=${{ needs['web-editor'].result }}"; exit 1 ;;
          esac
