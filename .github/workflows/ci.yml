name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      track_ed: ${{ steps.filter.outputs.track_ed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'fixtures/**'
              - 'crates/sim-types/**'
              - 'crates/sim-asset/**'
              - 'crates/sim-core/**'
              - 'crates/sim-render/**'
              - 'crates/sim-worker/**'
              - 'crates/asset-compiler/**'
              - 'crates/track-pack/**'
              - 'crates/track-pack-wasm/**'
              - 'crates/relay-server/src/protocol.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            track_ed:
              - 'web/track-ed-src'
              - 'web/track-ed-src/**'
              - 'web/scripts/build-track-ed.sh'
              - 'web/scripts/check-track-ed-deps.py'
              - 'web/tests/track-ed-hosted.spec.ts'
              - '.github/workflows/**'

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent config sync
        run: python3 scripts/check-agent-sync.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p sim-types -p sim-asset -p sim-core -p sim-render -p sim-worker -p track-pack-wasm --target wasm32-unknown-unknown

  web:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: web (shard ${{ matrix.shard }}/3)
    env:
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Node tests
        if: matrix.shard == 1
        working-directory: web
        run: npm test
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        # WebGL2 fallback tests are excluded from CI because hosted runners
        # cannot provide a reliable WebGL context. Run them locally before
        # pushing (see .githooks/pre-push).
        run: >-
          npm run test:viewer -- --project=default
          --grep-invert "WebGL2 fallback"
          --shard=${{ matrix.shard }}/3

  web-smoke:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    name: web-smoke
    env:
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Node tests
        working-directory: web
        run: npm test
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: web
        env:
          CI: "true"
        run: >-
          npm run test:viewer -- --project=default
          --grep "drive viewer settles and accepts keyboard input|garage viewer renders the car on the track|default demos use skidpad and the rx7 without url params|pwa installs a service worker and enables cross-origin isolation|track viewer camera orbit"
          --grep-invert "WebGL2 fallback"

  web-editor:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: web-editor smoke
    env:
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: >-
          npm run test:viewer -- --project=track-editor
          --grep "renders the procedural example track|kerb spans can be trimmed and rebuilt|editing a kerb segment preserves the camera view|track editor boots the @6 single-section B-spline loop|clicking the road inserts and selects a new point|editor modes switch and gate point editing"

  track-ed:
    needs: changes
    if: needs.changes.outputs.track_ed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: track-ed
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/track-ed-src/package-lock.json
      - name: Install track-ed dependencies
        working-directory: web/track-ed-src
        run: npm ci
      - name: Type-check
        working-directory: web/track-ed-src
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: web/track-ed-src
        run: npm test
      - name: Build
        working-directory: web/track-ed-src
        run: npm run build
      - name: Audit runtime dependencies
        working-directory: web/track-ed-src
        run: npm audit --omit=dev
      - name: Check dependency pins and notices
        run: python3 web/scripts/check-track-ed-deps.py

  track-ed-hosted:
    needs: changes
    if: >-
      needs.changes.outputs.track_ed == 'true' ||
      needs.changes.outputs.web == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: track-ed hosted smoke
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/track-ed-src/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install track-ed dependencies
        working-directory: web/track-ed-src
        run: npm ci
      - name: Build viewer
        working-directory: web
        run: npm run build:viewer
      - name: Build hosted track-ed
        working-directory: web
        run: bash scripts/build-track-ed.sh
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Hosted track-ed browser smoke
        working-directory: web
        env:
          CI: "true"
        run: bash scripts/test-viewer.sh --project=default tests/track-ed-hosted.spec.ts

  gate:
    name: gate
    if: always()
    needs:
      - changes
      - policy
      - rust
      - web
      - web-smoke
      - web-editor
      - track-ed
      - track-ed-hosted
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped jobs
        run: |
          echo "changes=${{ needs.changes.result }} policy=${{ needs.policy.result }} rust=${{ needs.rust.result }} web=${{ needs.web.result }} web-smoke=${{ needs['web-smoke'].result }} web-editor=${{ needs['web-editor'].result }} track-ed=${{ needs['track-ed'].result }} track-ed-hosted=${{ needs['track-ed-hosted'].result }}"
          case "${{ needs.changes.result }}" in
            success|skipped) ;;
            *) echo "changes=${{ needs.changes.result }}"; exit 1 ;;
          esac
          test "${{ needs.policy.result }}" = "success"
          case "${{ needs.rust.result }}" in
            success|skipped) ;;
            *) echo "rust=${{ needs.rust.result }}"; exit 1 ;;
          esac
          case "${{ needs.web.result }}" in
            success|skipped) ;;
            *) echo "web=${{ needs.web.result }}"; exit 1 ;;
          esac
          case "${{ needs['web-smoke'].result }}" in
            success|skipped) ;;
            *) echo "web-smoke=${{ needs['web-smoke'].result }}"; exit 1 ;;
          esac
          case "${{ needs['web-editor'].result }}" in
            success|skipped) ;;
            *) echo "web-editor=${{ needs['web-editor'].result }}"; exit 1 ;;
          esac
          case "${{ needs['track-ed'].result }}" in
            success|skipped) ;;
            *) echo "track-ed=${{ needs['track-ed'].result }}"; exit 1 ;;
          esac
          case "${{ needs['track-ed-hosted'].result }}" in
            success|skipped) ;;
            *) echo "track-ed-hosted=${{ needs['track-ed-hosted'].result }}"; exit 1 ;;
          esac
