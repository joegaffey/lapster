[workspace]
resolver = "2"
members = [
    "crates/sim-types",
    "crates/sim-asset",
    "crates/asset-compiler",
    "crates/sim-core",
    "crates/sim-render",
    "crates/sim-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
