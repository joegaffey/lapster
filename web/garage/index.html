<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lapster" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <title>Garage Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0d;
        color: #e6e8eb;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #view.dragging {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(390px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid #2a303a;
        background: rgba(10, 13, 17, 0.9);
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.55;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      h2 {
        margin: 14px 0 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8f9bab;
      }
      p {
        margin: 0;
      }
      .muted {
        color: #8f9bab;
      }
      .status {
        margin-top: 6px;
        color: #fbbf24;
      }
      .status.ready {
        color: #34d399;
      }
      .status.error {
        color: #f87171;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 12px;
        margin: 0;
      }
      dt {
        color: #8f9bab;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .name {
        flex: 1;
      }
      #paint-panel {
        position: fixed;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: calc(100vw - 24px);
        padding: 5px 9px;
        border: 1px solid #2a303a;
        border-radius: 999px;
        background: rgba(10, 13, 17, 0.9);
        backdrop-filter: blur(8px);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 8px);
        transition:
          opacity 180ms ease,
          transform 200ms ease;
      }
      #paint-panel.paint-panel-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, 0);
      }
      .paint-options {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 6px;
      }
      .paint-swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 999px;
        background: var(--swatch, #8f9bab);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        cursor: pointer;
      }
      .paint-swatch:hover {
        transform: scale(1.08);
      }
      .paint-swatch[aria-checked="true"] {
        border-color: #38bdf8;
        box-shadow:
          0 0 0 2px #0a0d11,
          0 0 0 4px #38bdf8;
      }
      .paint-swatch:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      .controls {
        display: grid;
        gap: 8px;
      }
      .control-row {
        display: grid;
        grid-template-columns: 70px 1fr 52px;
        gap: 8px;
        align-items: center;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #38bdf8;
      }
      .toggle {
        display: flex;
        gap: 8px;
        align-items: center;
        color: #9aa4b2;
      }
      code {
        color: #cbd5e1;
      }
      #viewer-controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: min(620px, calc(100vw - 448px));
      }
      #viewer-controls > * {
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #cbd5e1;
        padding: 5px 8px;
        font: inherit;
        font-size: 11px;
        line-height: 1.35;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      #viewer-controls > *:hover {
        background: #1c2430;
      }
      #viewer-controls > .hud-exit[data-menu-static] {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0;
        line-height: 1;
      }
      #viewer-controls > .hud-exit[data-menu-static] svg {
        width: 18px;
        height: 18px;
      }
      #car-nav {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }
      #car-nav button {
        position: absolute;
        top: 50%;
        display: grid;
        place-items: center;
        width: 52px;
        height: 82px;
        border: 1px solid #3a4350;
        border-radius: 4px;
        background: rgba(15, 20, 27, 0.72);
        backdrop-filter: blur(8px);
        color: #e6e8eb;
        font: inherit;
        font-size: 34px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        touch-action: manipulation;
        opacity: 1;
        transform: translateY(-50%);
        transition:
          opacity 280ms ease,
          transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background-color 150ms ease,
          border-color 150ms ease;
      }
      #bay-prev {
        left: max(16px, env(safe-area-inset-left));
      }
      #bay-next {
        right: max(16px, env(safe-area-inset-right));
      }
      #car-nav button:hover {
        background: rgba(28, 36, 48, 0.9);
        border-color: #4b5766;
      }
      #car-nav button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      #car-nav.car-nav-hidden #bay-prev {
        opacity: 0;
        transform: translate(-14px, -50%);
        pointer-events: none;
      }
      #car-nav.car-nav-hidden #bay-next {
        opacity: 0;
        transform: translate(14px, -50%);
        pointer-events: none;
      }
      #hud.hud-collapsed {
        display: none;
      }
      @media (max-width: 720px) {
        #viewer-controls {
          top: 12px;
          left: 12px;
          right: 12px;
          justify-content: flex-start;
          max-width: none;
        }
        #car-nav button {
          width: 44px;
          height: 66px;
          font-size: 28px;
        }
        #hud {
          top: 84px;
          max-height: calc(100vh - 116px);
        }
        #paint-panel {
          bottom: max(10px, env(safe-area-inset-bottom));
          padding: 4px 8px;
        }
        .paint-swatch {
          width: 20px;
          height: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #car-nav button,
        #paint-panel,
        #car-loading {
          transition: none;
        }
      }
      #car-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 7;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 24px);
        padding: 5px 10px;
        border: 1px solid #2a303a;
        border-radius: 999px;
        background: rgba(10, 13, 17, 0.82);
        backdrop-filter: blur(8px);
        color: #9aa4b2;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-50% + 6px));
        transition:
          opacity 200ms ease,
          transform 220ms ease;
      }
      #car-loading.car-loading-visible {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
      #car-loading .loading-spinner {
        width: 12px;
        height: 12px;
      }
      #car-loading[data-state="error"] {
        color: #f87171;
      }
      #car-loading[data-state="error"] .loading-spinner {
        display: none;
      }
      #viewer-loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        background: #080a0d;
        color: #cbd5e1;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-align: center;
      }
      #viewer-loading[hidden] {
        display: none;
      }
      #viewer-loading[data-state="error"] {
        color: #f87171;
      }
      .loading-spinner {
        width: 18px;
        height: 18px;
        flex: none;
        border: 2px solid #2a303a;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: loading-spin 800ms linear infinite;
      }
      #viewer-loading[data-state="error"] .loading-spinner {
        display: none;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation-duration: 1600ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer-loading" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span data-loading-label>Loading…</span>
    </div>
    <div id="car-loading" role="status" aria-live="polite" aria-hidden="true">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span data-car-loading-label>Loading cars</span>
    </div>

    <canvas id="view"></canvas>
    <nav id="car-nav" class="car-nav-hidden" aria-label="Car navigation">
      <button id="bay-prev" type="button" aria-label="Previous car" title="Previous car">‹</button>
      <button id="bay-next" type="button" aria-label="Next car" title="Next car">›</button>
    </nav>
    <nav id="viewer-controls" aria-label="Viewer controls">
      <a class="hud-exit" href="../../" data-menu-static aria-label="Exit garage" title="Exit">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
      </a>
      <a id="drive-car" href="../drive/">Drive</a>
      <button id="reset-camera" type="button">Reset camera</button>
    </nav>
    <aside id="hud" class="hud-collapsed">
      <h1>Garage Viewer</h1>
      <p class="muted" id="asset">loading…</p>
      <p class="status" id="status">booting</p>

      <h2>Car</h2>
      <dl id="car-stats" data-testid="car-stats"></dl>

      <h2>Camera</h2>
      <p class="muted">Drag to orbit · wheel or pinch to zoom</p>
      <p class="muted" id="bay-label">Bay</p>

      <h2>Wheel Debug</h2>
      <div class="controls">
        <div class="control-row">
          <span>steer</span>
          <input id="steer" type="range" min="-0.6" max="0.6" step="0.01" value="0" />
          <span id="steer-value">0.00</span>
        </div>
        <div class="control-row">
          <span>spin</span>
          <input id="spin" type="range" min="-6.28" max="6.28" step="0.01" value="0" />
          <span id="spin-value">0.00</span>
        </div>
        <label class="toggle">
          <input id="animate" type="checkbox" />
          animate wheel spin
        </label>
      </div>

      <h2>Wheels</h2>
      <ul id="wheels" data-testid="wheels"></ul>

      <h2>Frame</h2>
      <dl id="timing" data-testid="timing">
        <dt>fps</dt>
        <dd id="fps">—</dd>
        <dt>frame</dt>
        <dd id="frame-ms">—</dd>
      </dl>

      <h2>Stats</h2>
      <dl id="stats" data-testid="stats"></dl>

      <h2>Surfaces</h2>
      <ul id="surfaces"></ul>
    </aside>
    <section id="paint-panel" aria-label="Car paint" aria-hidden="true" inert>
      <div
        id="paint-options"
        class="paint-options"
        role="radiogroup"
        aria-label="Car paint"
      ></div>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
