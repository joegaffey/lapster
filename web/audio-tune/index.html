<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine audio tuner</title>
    <style>
      :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b0e12; color: #e6e8eb; }
      body { display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: 100vh; }
      #stage { position: relative; min-width: 0; background: #05070a; overflow: hidden; }
      #garage-frame { width: 100%; height: 100%; border: 0; display: block; }
      #stage-hud { position: absolute; left: 24px; bottom: 20px; pointer-events: none; }
      #speed-big { font-size: 56px; font-weight: 700; line-height: 1; color: #f4f7fb; font-variant-numeric: tabular-nums; }
      #speed-big span { font-size: 16px; font-weight: 500; color: #8f9bab; margin-left: 6px; }
      #stage-sub { margin-top: 4px; color: #8fd3ff; font-size: 13px; }
      #panel { overflow-y: auto; padding: 14px 16px 40px; background: rgba(13, 17, 22, 0.98); border-left: 1px solid #232b34; }
      h1 { font-size: 16px; margin: 0; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8fd3ff; margin: 18px 0 8px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row > label { flex: 0 0 92px; color: #9aa6b2; }
      .row > select, .row > input[type="file"] { flex: 1; min-width: 0; }
      select, input[type="file"], button { background: #151b22; color: #e6e8eb; border: 1px solid #2c3742; border-radius: 5px; padding: 6px 8px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: #3d7ea6; }
      button.primary { background: #1d5b7a; border-color: #3d7ea6; }
      button.active { background: #2f6b3f; border-color: #4f9f68; }
      .slider { margin: 7px 0; }
      .slider label { display: flex; justify-content: space-between; color: #9aa6b2; }
      .slider input { width: 100%; accent-color: #38bdf8; }
      output { color: #ffd479; font-variant-numeric: tabular-nums; }
      #meta { color: #b8c2cc; font-size: 12px; }
      #meta table { width: 100%; border-collapse: collapse; }
      #meta td { padding: 1px 0; vertical-align: top; }
      #meta td:first-child { color: #7d8996; width: 42%; }
      #meta code { color: #8fd3ff; }
      #graph { width: 100%; height: 150px; display: block; margin-top: 8px; background: #0a0e13; border: 1px solid #232b34; border-radius: 6px; }
      #live { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
      #live .k { color: #7d8996; }
      #live .v { text-align: right; }
      #status { color: #ffd479; min-height: 18px; margin-top: 8px; }
      .hint { color: #7d8996; font-size: 11px; margin: 4px 0 0; }
      .hidden { display: none !important; }
      .warn { color: #f87171; }
      @media (max-width: 900px) {
        body { grid-template-columns: 1fr; grid-template-rows: 1fr 54vh; }
        #panel { border-left: 0; border-top: 1px solid #232b34; }
        #speed-big { font-size: 40px; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="garage-frame" title="Car studio"></iframe>
      <div id="stage-hud">
        <div id="speed-big">0<span>km/h</span></div>
        <div id="stage-sub">gear 1 · 900 rpm</div>
      </div>
    </div>
    <aside id="panel">
      <header>
        <h1>Engine audio tuner</h1>
        <button id="audio" class="primary">Start audio</button>
      </header>
      <p class="hint">Real car models in the garage studio. Throttle/brake only — no steering. Drag the car view to orbit.</p>

      <h2>Car &amp; sample</h2>
      <div class="row"><label for="car">Car</label><select id="car"></select></div>
      <div class="row"><label for="sample">Sample</label><select id="sample"></select></div>
      <div class="row"><label for="file">Custom WAV</label><input id="file" type="file" accept="audio/*" /></div>
      <div class="row"><label></label><button id="car-sample">Use car source</button><button id="mute">Mute</button></div>

      <h2>Engine / gearbox</h2>
      <div id="meta"></div>

      <h2>Throttle &amp; gearbox</h2>
      <div class="slider">
        <label>Throttle <output id="throttle-value"></output></label>
        <input id="throttle" type="range" min="0" max="1" step="0.01" value="0" />
      </div>
      <div class="slider">
        <label>Brake <output id="brake-value"></output></label>
        <input id="brake" type="range" min="0" max="1" step="0.01" value="0" />
      </div>
      <div class="row"><label for="gear">Gear</label><select id="gear"></select></div>
      <div class="row"><label></label><button id="reset-sim">Reset speed</button></div>
      <div class="hint" id="gear-note"></div>

      <h2>RPM → playback rate</h2>
      <div class="slider">
        <label>RPM low <output id="rpm-low-value"></output></label>
        <input id="rpm-low" type="range" min="400" max="12000" step="10" />
      </div>
      <div class="slider">
        <label>RPM high <output id="rpm-high-value"></output></label>
        <input id="rpm-high" type="range" min="400" max="12000" step="10" />
      </div>
      <div class="slider">
        <label>Rate low <output id="rate-low-value"></output></label>
        <input id="rate-low" type="range" min="0.3" max="2.5" step="0.01" />
      </div>
      <div class="slider">
        <label>Rate high <output id="rate-high-value"></output></label>
        <input id="rate-high" type="range" min="0.3" max="2.5" step="0.01" />
      </div>
      <div class="slider">
        <label>Curve <output id="curve-value"></output></label>
        <input id="curve" type="range" min="0.4" max="2.5" step="0.05" />
      </div>
      <div class="slider">
        <label>Engine gain <output id="gain-value"></output></label>
        <input id="gain" type="range" min="0" max="1" step="0.01" />
      </div>
      <canvas id="graph"></canvas>
      <div class="hint">Current: <span id="rate-readout">-</span></div>

      <h2>Live</h2>
      <div id="live"></div>

      <h2>Mapping store</h2>
      <div class="row">
        <label></label>
        <button id="copy">Copy JSON</button>
        <button id="reset">Reset mapping</button>
      </div>
      <div id="status"></div>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
