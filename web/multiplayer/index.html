<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lapster" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <title>Lapster — Multiplayer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #080a0d;
        color: #e6e8eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.14), transparent 36%),
          radial-gradient(circle at 85% 100%, rgba(34, 197, 94, 0.1), transparent 42%),
          #080a0d;
      }
      main {
        width: min(620px, 100%);
        border: 1px solid #2a303a;
        background: rgba(10, 13, 17, 0.94);
        padding: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }
      .eyebrow {
        color: #38bdf8;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 6px;
        font-size: clamp(30px, 7vw, 48px);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 18px;
        color: #8f9bab;
        line-height: 1.55;
        font-size: 12px;
      }
      form,
      label {
        display: grid;
        gap: 6px;
      }
      form {
        gap: 14px;
      }
      label {
        color: #cbd5e1;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      input {
        width: 100%;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #e6e8eb;
        padding: 9px 10px;
        font: inherit;
        font-size: 13px;
      }
      input:focus {
        outline: 1px solid #38bdf8;
        border-color: #38bdf8;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 2px 0 4px;
      }
      .chip {
        border: 1px solid #3a4350;
        background: #151a21;
        color: #9aa4b2;
        padding: 4px 7px;
        font-size: 10px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      button,
      a.button {
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #e6e8eb;
        padding: 9px 13px;
        font: inherit;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary {
        border-color: #38bdf8;
        background: #38bdf8;
        color: #081018;
        font-weight: 700;
      }
      button:hover,
      a.button:hover {
        background: #1c2430;
      }
      button.primary:hover {
        background: #7dd3fc;
      }
      .status {
        min-height: 18px;
        margin: 12px 0 0;
        color: #8f9bab;
        font-size: 11px;
      }
      .status.error {
        color: #f87171;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 22px;
        color: #667080;
        font-size: 11px;
      }
      footer a {
        color: #9aa4b2;
      }
      @media (max-width: 520px) {
        main {
          padding: 18px;
        }
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Relay multiplayer</div>
      <h1>Join a room</h1>
      <p>
        Share the invite link, then give friends the password separately if you set one.
        Everyone uses the same car and track. Cars can overlap; collisions are not enabled yet.
      </p>
      <div class="summary" aria-live="polite">
        <span class="chip" id="car-name">Car</span>
        <span class="chip" id="track-name">Track</span>
        <span class="chip" id="server-name">Server: this page</span>
      </div>
      <form id="join-form">
        <label>
          Relay server <span class="chip">optional</span>
          <input
            id="relay"
            name="relay"
            autocomplete="off"
            spellcheck="false"
            placeholder="wss://relay.example.test/ws — blank uses this page"
          />
        </label>
        <label>
          Room code
          <div class="row">
            <input id="room" name="room" autocomplete="off" spellcheck="false" maxlength="32" />
            <button id="new-room" type="button">New code</button>
          </div>
        </label>
        <label>
          Your name
          <input id="name" name="name" autocomplete="nickname" maxlength="24" />
        </label>
        <label>
          Room password <span class="chip">optional</span>
          <input id="password" name="password" type="password" autocomplete="off" maxlength="64" />
        </label>
        <div class="actions">
          <button class="primary" type="submit" data-testid="join">Join room</button>
          <button id="copy-invite" type="button">Copy invite link</button>
          <a class="button" href="../">Back to menu</a>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <footer>
        <span>Relay only. No server physics.</span>
        <a href="https://github.com/joegaffey/lapster" target="_blank" rel="noreferrer">Source</a>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
