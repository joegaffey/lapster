<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0d;
        color: #e6e8eb;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(400px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid #2a303a;
        background: rgba(10, 13, 17, 0.9);
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.55;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      h2 {
        margin: 14px 0 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8f9bab;
      }
      p {
        margin: 0;
      }
      .muted {
        color: #8f9bab;
      }
      .status {
        margin-top: 6px;
        color: #fbbf24;
      }
      .status.ready {
        color: #34d399;
      }
      .status.error {
        color: #f87171;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 12px;
        margin: 0;
      }
      dt {
        color: #8f9bab;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .name {
        flex: 1;
      }
      .speed {
        font-size: 34px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #f8fafc;
      }
      .speed small {
        font-size: 12px;
        color: #8f9bab;
      }
      kbd {
        display: inline-block;
        min-width: 18px;
        padding: 0 4px;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #cbd5e1;
        text-align: center;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        color: #9aa4b2;
      }
      button {
        border: 1px solid #3a4350;
        background: #151a21;
        color: #e6e8eb;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #1c2430;
      }
      #hud > h1 {
        padding-right: 82px;
      }
      .hud-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #cbd5e1;
        padding: 4px 8px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .hud-toggle:hover {
        background: #1c2430;
      }
      #hud.hud-collapsed {
        width: auto;
        max-height: none;
        overflow: visible;
        padding: 8px 10px;
      }
      #hud.hud-collapsed > :not(.hud-toggle) {
        display: none;
      }
      #hud.hud-collapsed .hud-toggle {
        position: static;
      }
      #touch-controls {
        display: none;
        position: fixed;
        inset: auto 0 0 0;
        z-index: 5;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 18px calc(18px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .touch-cluster {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        pointer-events: auto;
      }
      .touch-right {
        flex-direction: column;
        align-items: flex-end;
      }
      .touch-button {
        width: 76px;
        height: 76px;
        border: 1px solid #4a5565;
        border-radius: 50%;
        background: rgba(15, 19, 25, 0.82);
        color: #e6e8eb;
        padding: 0;
        font-size: 24px;
        line-height: 1;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        backdrop-filter: blur(6px);
      }
      .touch-button.active {
        border-color: #38bdf8;
        background: #38bdf8;
        color: #081018;
      }
      .touch-throttle {
        width: 86px;
        height: 86px;
      }
      .touch-reset {
        position: absolute;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        pointer-events: auto;
      }
      @media (pointer: coarse), (max-width: 720px) {
        #touch-controls {
          display: flex;
        }
        #hud {
          top: 12px;
          left: 12px;
          width: min(360px, calc(100vw - 24px));
          max-height: calc(100vh - 128px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="hud">
      <h1>Drive Viewer</h1>
      <p class="muted" id="asset">loading…</p>
      <p class="status" id="status" data-testid="status">booting</p>

      <h2>Speed</h2>
      <p class="speed"><span id="speed" data-testid="speed">0.0</span> <small>km/h</small></p>

      <h2>Engine</h2>
      <dl>
        <dt>rpm</dt>
        <dd id="rpm" data-testid="rpm">—</dd>
        <dt>gear</dt>
        <dd id="gear" data-testid="gear">—</dd>
        <dt>contacts</dt>
        <dd id="contacts" data-testid="contacts">—</dd>
        <dt>rack torque</dt>
        <dd id="rack-torque">—</dd>
      </dl>

      <h2>Simulation</h2>
      <dl>
        <dt>tick</dt>
        <dd id="tick" data-testid="tick">—</dd>
        <dt>step p50</dt>
        <dd id="step-p50" data-testid="step-p50">—</dd>
        <dt>step p99</dt>
        <dd id="step-p99" data-testid="step-p99">—</dd>
        <dt>fps</dt>
        <dd id="fps">—</dd>
      </dl>

      <h2>Wheels</h2>
      <ul id="wheels" data-testid="wheels"></ul>

      <h2>Controls</h2>
      <p class="controls">
        <span><kbd>W</kbd>/<kbd>↑</kbd> throttle</span>
        <span><kbd>S</kbd>/<kbd>↓</kbd> brake / reverse</span>
        <span><kbd>A</kbd><kbd>D</kbd> or <kbd>←</kbd><kbd>→</kbd> steer</span>
        <span><kbd>0</kbd> reverse (manual)</span>
        <span><kbd>1</kbd>–<kbd>6</kbd> gear</span>
        <span><kbd>R</kbd> reset</span>
        <span>auto reverse at standstill</span>
      </p>
      <p style="margin-top: 8px">
        <button id="reset" data-testid="reset">Reset</button>
      </p>
    </aside>
    <div id="touch-controls" aria-label="Touch controls">
      <div class="touch-cluster">
        <button class="touch-button" data-key="a" type="button" aria-label="Steer left">◀</button>
        <button class="touch-button" data-key="d" type="button" aria-label="Steer right">▶</button>
      </div>
      <div class="touch-cluster touch-right">
        <button class="touch-button touch-throttle" data-key="w" type="button" aria-label="Throttle">▲</button>
        <button class="touch-button" data-key="s" type="button" aria-label="Brake or reverse">▼</button>
      </div>
      <button id="touch-reset" class="touch-reset" type="button" aria-label="Reset car">R</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
