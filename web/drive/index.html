<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lapster" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <title>Drive Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0d;
        color: #e6e8eb;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(400px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid #2a303a;
        background: rgba(10, 13, 17, 0.9);
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.55;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      h2 {
        margin: 14px 0 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8f9bab;
      }
      p {
        margin: 0;
      }
      .muted {
        color: #8f9bab;
      }
      .status {
        margin-top: 6px;
        color: #fbbf24;
      }
      .status.ready {
        color: #34d399;
      }
      .status.error {
        color: #f87171;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 12px;
        margin: 0;
      }
      dt {
        color: #8f9bab;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .name {
        flex: 1;
      }
      .speed {
        font-size: 34px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #f8fafc;
      }
      .speed small {
        font-size: 12px;
        color: #8f9bab;
      }
      kbd {
        display: inline-block;
        min-width: 18px;
        padding: 0 4px;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #cbd5e1;
        text-align: center;
      }
      button {
        border: 1px solid #3a4350;
        background: #151a21;
        color: #e6e8eb;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #1c2430;
      }
      #viewer-controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: min(620px, calc(100vw - 448px));
      }
      #viewer-controls > * {
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #cbd5e1;
        padding: 5px 8px;
        font: inherit;
        font-size: 11px;
        line-height: 1.35;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      #viewer-controls > *:hover {
        background: #1c2430;
      }
      #hud.hud-collapsed {
        display: none;
      }
      #touch-controls {
        display: none;
        position: fixed;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        inset: auto 0 0 0;
        z-index: 5;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 18px calc(18px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .touch-cluster {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        pointer-events: auto;
      }
      .touch-right {
        flex-direction: column;
        align-items: flex-end;
      }
      .touch-button {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 1px solid #4a5565;
        border-radius: 50%;
        background: rgba(15, 19, 25, 0.82);
        color: #e6e8eb;
        padding: 0;
        font-size: 24px;
        line-height: 1;
        -webkit-user-drag: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        backdrop-filter: blur(6px);
      }
      .touch-button.active {
        border-color: #38bdf8;
        background: #38bdf8;
        color: #081018;
      }
      .touch-throttle {
        width: 86px;
        height: 86px;
      }
      .touch-button svg {
        width: 34px;
        height: 34px;
        fill: currentColor;
        pointer-events: none;
      }
      #car-setup-dialog,
      #assists-dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: min(86vh, 900px);
        padding: 0;
        overflow: auto;
        border: 1px solid #3a4350;
        border-radius: 4px;
        background: #0d1117;
        color: #e6e8eb;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }
      #car-setup-dialog::backdrop,
      #assists-dialog::backdrop {
        background: rgba(0, 0, 0, 0.62);
        backdrop-filter: blur(2px);
      }
      #assists-dialog {
        width: min(480px, calc(100vw - 32px));
      }
      .assist-body {
        display: grid;
        gap: 14px;
        padding: 4px 16px 16px;
      }
      .assist-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
      }
      .assist-slider {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        align-items: center;
        color: #cbd5e1;
        font-size: 12px;
      }
      .assist-slider input {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #38bdf8;
      }
      .assist-slider output {
        color: #8f9bab;
        text-align: right;
      }
      .assist-slider select {
        grid-column: 1 / -1;
        width: 100%;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #e6e8eb;
        padding: 5px 6px;
        font: inherit;
        font-size: 11px;
      }
      .setup-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid #2a303a;
        background: #0d1117;
      }
      .setup-header h2 {
        margin: 0;
        color: #e6e8eb;
        font-size: 14px;
        letter-spacing: 0;
        text-transform: none;
      }
      .setup-body {
        padding: 4px 16px 8px;
      }
      .setup-section {
        border-bottom: 1px solid #202630;
      }
      .setup-section > summary {
        padding: 10px 0;
        color: #cbd5e1;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .setup-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 16px;
        padding: 0 0 12px;
      }
      .setup-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 92px auto;
        gap: 6px;
        align-items: center;
        font-size: 11px;
      }
      .setup-field-wide {
        grid-column: 1 / -1;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 2fr) auto;
      }
      .setup-field input {
        width: 100%;
        min-width: 0;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #e6e8eb;
        padding: 4px 6px;
        font: inherit;
        font-size: 11px;
      }
      .setup-field input:focus {
        outline: 1px solid #38bdf8;
        border-color: #38bdf8;
      }
      .setup-unit {
        color: #8f9bab;
        white-space: nowrap;
      }
      .setup-import {
        margin: 4px 16px 0;
        padding: 8px 0;
        border-top: 1px solid #202630;
        color: #9aa4b2;
        font-size: 11px;
      }
      .setup-import summary {
        cursor: pointer;
      }
      .setup-import textarea {
        display: block;
        width: 100%;
        min-height: 70px;
        margin: 8px 0;
        border: 1px solid #3a4350;
        border-radius: 3px;
        background: #151a21;
        color: #e6e8eb;
        padding: 6px;
        font: inherit;
        font-size: 11px;
      }
      .setup-footer {
        position: sticky;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-top: 1px solid #2a303a;
        background: #0d1117;
      }
      .setup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .setup-status {
        margin: 0;
        color: #8f9bab;
        font-size: 11px;
      }
      .setup-error {
        color: #f87171;
      }
      @media (pointer: coarse), (max-width: 720px) {
        #touch-controls {
          display: flex;
        }
        #viewer-controls {
          top: 12px;
          left: 12px;
          right: 12px;
          justify-content: flex-start;
          max-width: none;
        }
        #hud {
          top: 84px;
          left: 12px;
          width: min(360px, calc(100vw - 24px));
          max-height: calc(100vh - 200px);
        }
        .setup-grid {
          grid-template-columns: 1fr;
        }
      }
      #viewer-loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        background: #080a0d;
        color: #cbd5e1;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-align: center;
      }
      #viewer-loading[hidden] {
        display: none;
      }
      #viewer-loading[data-state="error"] {
        color: #f87171;
      }
      .loading-spinner {
        width: 18px;
        height: 18px;
        flex: none;
        border: 2px solid #2a303a;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: loading-spin 800ms linear infinite;
      }
      #viewer-loading[data-state="error"] .loading-spinner {
        display: none;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation-duration: 1600ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer-loading" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span data-loading-label>Loading…</span>
    </div>

    <canvas id="view"></canvas>
    <nav id="viewer-controls" aria-label="Drive controls">
      <a class="hud-exit" href="../">Exit</a>
      <button id="reset" data-testid="reset">Reset</button>
      <button id="camera-mode" data-testid="camera-mode">Camera: Chase</button>
      <button id="body-toggle" data-testid="body-toggle">Body: Visible</button>
      <button id="setup-open" data-testid="setup-open" aria-haspopup="dialog">Tuning</button>
      <button id="audio-toggle" data-testid="audio-toggle" aria-pressed="false">Audio: Off</button>
      <button id="assists-open" data-testid="assists-open" aria-haspopup="dialog">Settings</button>
    </nav>
    <aside id="hud" class="hud-collapsed">
      <h1>Drive Viewer</h1>
      <p class="muted" id="asset">loading…</p>
      <p class="status" id="status" data-testid="status">booting</p>

      <h2>Speed</h2>
      <p class="speed"><span id="speed" data-testid="speed">0.0</span> <small>km/h</small></p>

      <h2>Engine</h2>
      <dl>
        <dt>rpm</dt>
        <dd id="rpm" data-testid="rpm">—</dd>
        <dt>gear</dt>
        <dd id="gear" data-testid="gear">—</dd>
        <dt>contacts</dt>
        <dd id="contacts" data-testid="contacts">—</dd>
        <dt>rack torque</dt>
        <dd id="rack-torque">—</dd>
        <dt>surface</dt>
        <dd id="surface" data-testid="surface">—</dd>
      </dl>

      <h2>Simulation</h2>
      <dl>
        <dt>tick</dt>
        <dd id="tick" data-testid="tick">—</dd>
        <dt>step p50</dt>
        <dd id="step-p50" data-testid="step-p50">—</dd>
        <dt>step p99</dt>
        <dd id="step-p99" data-testid="step-p99">—</dd>
        <dt>fps</dt>
        <dd id="fps">—</dd>
      </dl>

      <h2>Wheels</h2>
      <ul id="wheels" data-testid="wheels"></ul>
    </aside>
    <dialog id="car-setup-dialog" aria-labelledby="car-setup-title">
      <header class="setup-header">
        <h2 id="car-setup-title">Tuning</h2>
        <button id="car-setup-close" type="button">Close</button>
      </header>
      <p class="setup-status" style="padding: 10px 16px 0">
        Mass, wheelbase, track width, and wheel geometry are fixed by the car model.
      </p>
      <div id="car-setup-body" class="setup-body"></div>
      <details class="setup-import">
        <summary>Paste shared settings</summary>
        <textarea id="car-setup-import-text" spellcheck="false" placeholder="Paste the JSON copied from another session, then choose Apply pasted."></textarea>
        <button id="car-setup-import-apply" type="button">Apply pasted</button>
      </details>
      <footer class="setup-footer">
        <p id="car-setup-status" class="setup-status" aria-live="polite"></p>
        <div class="setup-actions">
          <button id="car-setup-reset" type="button">Reset defaults</button>
          <button id="car-setup-copy" type="button">Copy settings</button>
          <button id="car-setup-apply" type="button">Apply</button>
        </div>
      </footer>
    </dialog>

    <div id="touch-controls" aria-label="Touch controls">
      <div class="touch-cluster">
        <button class="touch-button" data-key="a" type="button" draggable="false" aria-label="Steer left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 5 12l10 8z" /></svg>
        </button>
        <button class="touch-button" data-key="d" type="button" draggable="false" aria-label="Steer right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 19 12 9 20z" /></svg>
        </button>
      </div>
      <div class="touch-cluster touch-right">
        <button class="touch-button touch-throttle" data-key="w" type="button" draggable="false" aria-label="Throttle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 21 20H3z" /></svg>
        </button>
        <button class="touch-button" data-key="s" type="button" draggable="false" aria-label="Brake or reverse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 3 4h18z" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
