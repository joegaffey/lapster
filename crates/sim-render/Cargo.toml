[package]
name = "sim-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = "0.27"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-asset = { path = "../sim-asset" }
sim-core = { path = "../sim-core" }
sim-types = { path = "../sim-types" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Performance", "Window", "console"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgl", "webgpu", "wgsl"] }
