[package]
name = "asset-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "asset-compiler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glam = "0.27"
gltf = "1.4.1"
image = { version = "0.25", default-features = false, features = ["dds"] }
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-asset = { path = "../sim-asset" }
sim-types = { path = "../sim-types" }

[dev-dependencies]
sim-core = { path = "../sim-core" }
